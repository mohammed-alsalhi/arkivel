version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "America/Chicago"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      all:
        patterns: ["*"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      actions:
        patterns: ["*"]
