# Arkivel with its own PostgreSQL. Run from the repository root:
#   docker compose -f deploy/docker/compose.yml --env-file .env up -d --build
# Set ARKIVEL_IMAGE=ghcr.io/mohammed-alsalhi/arkivel:vX.Y.Z to run a published
# image instead of building (then drop --build). See deploy/README.md.

x-app-config: &app-config
  # Public settings are compiled into the build; defaults live in src/lib/config.ts.
  ARKIVEL_SITE_MODE: "${ARKIVEL_SITE_MODE:-}"
  NEXT_PUBLIC_BASE_URL: "${NEXT_PUBLIC_BASE_URL:-}"
  NEXT_PUBLIC_ARKIVEL_SKIN: "${NEXT_PUBLIC_ARKIVEL_SKIN:-}"
  NEXT_PUBLIC_ARKIVEL_NAME: "${NEXT_PUBLIC_ARKIVEL_NAME:-}"
  NEXT_PUBLIC_ARKIVEL_DESCRIPTION: "${NEXT_PUBLIC_ARKIVEL_DESCRIPTION:-}"
  NEXT_PUBLIC_ARKIVEL_WELCOME_TEXT: "${NEXT_PUBLIC_ARKIVEL_WELCOME_TEXT:-}"
  NEXT_PUBLIC_ARKIVEL_LOGO: "${NEXT_PUBLIC_ARKIVEL_LOGO:-}"
  NEXT_PUBLIC_ARKIVEL_LOGO_MARK: "${NEXT_PUBLIC_ARKIVEL_LOGO_MARK:-}"
  NEXT_PUBLIC_ARKIVEL_APP_ICON: "${NEXT_PUBLIC_ARKIVEL_APP_ICON:-}"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-arkivel}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-arkivel}"
      POSTGRES_DB: "${POSTGRES_DB:-arkivel}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arkivel} -d ${POSTGRES_DB:-arkivel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: "${ARKIVEL_IMAGE:-arkivel:local}"
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: *app-config
    restart: unless-stopped
    ports:
      - "${ARKIVEL_PORT:-3000}:3000"
    environment:
      <<: *app-config
      DATABASE_URL: "postgresql://${POSTGRES_USER:-arkivel}:${POSTGRES_PASSWORD:-arkivel}@db:5432/${POSTGRES_DB:-arkivel}"
      ARKIVEL_ACCESS: "${ARKIVEL_ACCESS:-public}"
      ARKIVEL_STORAGE: "${ARKIVEL_STORAGE:-local}"
      ARKIVEL_UPLOAD_DIR: /app/data/uploads
      ARKIVEL_S3_BUCKET: "${ARKIVEL_S3_BUCKET:-}"
      ARKIVEL_S3_REGION: "${ARKIVEL_S3_REGION:-auto}"
      ARKIVEL_S3_ENDPOINT: "${ARKIVEL_S3_ENDPOINT:-}"
      ARKIVEL_S3_FORCE_PATH_STYLE: "${ARKIVEL_S3_FORCE_PATH_STYLE:-false}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      ARKIVEL_REGISTRATION: "${ARKIVEL_REGISTRATION:-closed}"
      ARKIVEL_MODULES: "${ARKIVEL_MODULES:-}"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      OMDB_API_KEY: "${OMDB_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}}"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
