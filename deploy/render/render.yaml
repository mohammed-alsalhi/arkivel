# Render Blueprint. Render reads render.yaml from the repository root, so either
# copy this file there or create the two services by hand with the same values.
services:
  - type: web
    name: arkivel
    runtime: docker
    plan: starter
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: arkivel-uploads
      mountPath: /app/data/uploads
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arkivel-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: ARKIVEL_REGISTRATION
        value: closed
      - key: ARKIVEL_STORAGE
        value: local
      - key: ARKIVEL_UPLOAD_DIR
        value: /app/data/uploads
      # Public values compile into the image; Render passes envVars as build args.
      - key: ARKIVEL_SITE_MODE
        value: wiki
      - key: NEXT_PUBLIC_BASE_URL
        value: https://arkivel.onrender.com

databases:
  - name: arkivel-db
    plan: basic-256mb
    postgresMajorVersion: "16"
